# Price Job: ดึงราคาล่าสุดของหุ้น / กองทุน / ทองคำ ที่เปิด "ดึงราคาอัตโนมัติ" → Supabase
# Repository secrets: SUPABASE_URL, SUPABASE_SECRET_KEY · SEC_API_KEY (กองทุนไทย · ไม่มี = ข้ามกองทุน)
name: Prices (auto)

on:
  schedule:
    # 09:07 · 14:07 · 19:07 เวลาไทย จันทร์–ศุกร์ (GitHub เริ่มช้ากว่ากำหนด ~25–35 นาที และบางครั้งข้ามรอบ)
    #   หลายรอบ: ราคาทองสมาคมฯ เป็นปัจจุบันขึ้น (วันเดียวกันเก็บรอบล่าสุด) · NAV ที่ ก.ล.ต. ประกาศช้าได้ในรอบถัดไป · รอบเย็นหลังตลาดหุ้นไทยปิด
    - cron: "7 2,7,12 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "ทดลองอ่านอย่างเดียว ไม่บันทึก"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test parser
        run: node scripts/price-fetch.test.mjs
      - name: Fetch prices and upsert to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SEC_API_KEY: ${{ secrets.SEC_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/price-fetch.mjs

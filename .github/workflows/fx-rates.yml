# FX Job: ดึงอัตราแลกเปลี่ยนรายวัน → Supabase (fx_rates)
#   แหล่งตามที่ ADMIN เลือกที่ Settings → System: ธปท. หรือ ธนาคารกรุงเทพ
# Repository secrets: SUPABASE_URL, SUPABASE_SECRET_KEY + BOT_API_TOKEN (ธปท.) / BBL_API_KEY (ธนาคารกรุงเทพ)
name: FX rates

on:
  schedule:
    - cron: "30 12 * * *"   # 19:30 เวลาไทย ทุกวัน (ดึงย้อนหลัง 10 วัน เผื่อ ธปท. ประกาศช้า / วันหยุด)
  workflow_dispatch:
    inputs:
      start_date:
        description: "Backfill ตั้งแต่วันที่ (YYYY-MM-DD) — เว้นว่าง = ย้อนหลัง 10 วัน"
        required: false
      end_date:
        description: "ถึงวันที่ (YYYY-MM-DD) — เว้นว่าง = วันนี้"
        required: false
      dry_run:
        description: "ทดลองอ่านอย่างเดียว ไม่บันทึก (ใช้ตรวจครั้งแรกหลังตั้ง Key)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fx-rates
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test parser
        run: node scripts/fx-fetch.test.mjs
      - name: Fetch rates and upsert to Supabase
        env:
          BOT_API_TOKEN: ${{ secrets.BOT_API_TOKEN }}
          BBL_API_KEY: ${{ secrets.BBL_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: node scripts/fx-fetch.mjs
